<script>

let recognition = null;
let mediaRecorder = null;
let audioChunks = [];

// ============= API HELPERS =============
function callAppsScript(action, data) {
    return new Promise((resolve, reject) => {
        const callbackName = 'jsonp_callback_' + Date.now();
        
        window[callbackName] = (response) => {
            delete window[callbackName];
            document.body.removeChild(script);
            resolve(response);
        };

        const script = document.createElement('script');
        const params = new URLSearchParams({
            action: action,
            callback: callbackName,
            data: JSON.stringify(data)
        });
        
        script.src = `${CONFIG.APPS_SCRIPT_URL}?${params}`;
        script.onerror = () => {
            delete window[callbackName];
            if (document.body.contains(script)) {
                document.body.removeChild(script);
            }
            reject(new Error('Script load failed'));
        };
        
        document.body.appendChild(script);
    });
}

// ============= SPEECH RECOGNITION =============
function setupRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('Trình duyệt không hỗ trợ ghi âm. Vui lòng dùng Chrome!');
        return null;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recog = new SpeechRecognition();
    
    recog.continuous = true;
    recog.interimResults = true;
    recog.lang = 'en-US';

    recog.onresult = (event) => {
        let finalTranscript = '';
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcriptPiece = event.results[i][0].transcript;
            if (event.results[i].isFinal) {
                finalTranscript += transcriptPiece + ' ';
            } else {
                interimTranscript += transcriptPiece;
            }
        }

        if (finalTranscript) {
            state.transcript += finalTranscript;
        } else {
            const base = state.transcript;
            state.transcript = base + interimTranscript;
        }
        render();
    };

    return recog;
}

async function startRecording() {
    try {
        recognition = setupRecognition();
        if (!recognition) return;
        
        recognition.start();

        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];

        mediaRecorder.ondataavailable = (event) => {
            audioChunks.push(event.data);
        };

        mediaRecorder.start();
        state.isRecording = true;
        state.transcript = '';
        render();
    } catch (error) {
        alert('Không thể truy cập microphone!');
    }
}

function stopRecording() {
    if (recognition) recognition.stop();
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    }
    state.isRecording = false;
    render();
}

// ============= AI GRADING =============
async function submitToAI() {
    if (!state.transcript.trim()) {
        alert('Chưa có transcript để chấm!');
        return;
    }

    state.isProcessing = true;
    render();

    try {
        const prompt = `You are an FCE Speaking Part 2 examiner.

STUDENT: ${state.studentInfo.name} (${state.studentInfo.code})
TARGET LEVEL: ${state.studentInfo.targetLevel}

FCE GRADING CRITERIA (0-5 each):
1. Grammar and Vocabulary
2. Discourse Management  
3. Pronunciation (transcript errors = poor pronunciation)
4. Interactive Communication

TRANSCRIPT: "${state.transcript}"
QUESTION: "${state.currentPair.question}"

Respond ONLY with JSON:
{
  "grammar": 0-5,
  "discourse": 0-5,
  "pronunciation": 0-5,
  "interaction": 0-5,
  "total": 0-20,
  "feedback": "Vietnamese feedback 2-3 sentences"
}`;

        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${CONFIG.GROQ_API_KEY}`
            },
            body: JSON.stringify({
                model: 'llama-3.1-70b-versatile',
                messages: [{ role: 'user', content: prompt }],
                temperature: 0.3,
                max_tokens: 1000
            })
        });

        const data = await response.json();
        const aiText = data.choices[0].message.content;
        const jsonMatch = aiText.match(/\{[\s\S]*\}/);
        const gradingResult = jsonMatch ? JSON.parse(jsonMatch[0]) : null;

        if (!gradingResult) throw new Error('Invalid AI response');

        state.result = gradingResult;

        // Save to backend
        await callAppsScript('saveResult', {
            studentCode: state.studentInfo.code,
            studentName: state.studentInfo.name,
            targetLevel: state.studentInfo.targetLevel,
            timestamp: new Date().toISOString(),
            pairId: state.currentPair.id,
            transcript: state.transcript,
            grammar: gradingResult.grammar,
            discourse: gradingResult.discourse,
            pronunciation: gradingResult.pronunciation,
            interaction: gradingResult.interaction,
            totalScore: gradingResult.total,
            feedback: gradingResult.feedback
        });

        // Save audio if needed
        if (state.saveAudio || gradingResult.total >= 15) {
            await saveAudio(gradingResult);
        }

    } catch (error) {
        alert('Có lỗi: ' + error.message);
    } finally {
        state.isProcessing = false;
        render();
    }
}

async function saveAudio(gradingResult) {
    try {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const reader = new FileReader();
        
        reader.onloadend = async () => {
            const base64Audio = reader.result.split(',')[1];
            
            await callAppsScript('saveAudio', {
                studentCode: state.studentInfo.code,
                studentName: state.studentInfo.name,
                timestamp: new Date().toISOString(),
                score: gradingResult.total,
                audioBase64: base64Audio,
                mimeType: 'audio/webm'
            });
        };
        
        reader.readAsDataURL(audioBlob);
    } catch (error) {
        console.error('Error saving audio:', error);
    }
}

// ============= NAVIGATION =============
async function handleStudentLogin() {
    const code = document.getElementById('studentCode').value.toUpperCase();
    
    if (!code) {
        alert('Vui lòng nhập mã học sinh!');
        return;
    }
    
    // Validate với server
    try {
        const response = await callAppsScript('validateStudent', { code });
        
        if (response.success) {
            state.studentInfo = response.data;
            state.userType = 'student';
            state.isLoggedIn = true;
            loadRandomPair();
            render();
        } else {
            alert('Mã học sinh không đúng!');
        }
    } catch (error) {
        alert('Lỗi kết nối! Vui lòng thử lại.');
    }
}

async function handleTeacherLogin() {

function exportCSV() {
    let csv = 'Mã HS,Tên,Level,Số lần,Tổng,TB,Max,Min\n';
    state.allStudentsData.forEach(s => {
        csv += `${s.code},${s.name},${s.targetLevel},${s.totalAttempts},${s.totalScore},${s.averageScore},${s.maxScore},${s.minScore}\n`;
    });
    
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `fce_report_${new Date().toISOString().split('T')[0]}.csv`;
    link.click();
}

                                        <div class="text-center bg-gray-50 p-2 rounded">
                                            <div class="text-xs">Interaction</div>
                                            <div class="font-bold">${attempt.interaction}/5</div>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <div class="text-sm font-semibold mb-1">Transcript:</div>
                                        <div class="text-sm bg-gray-50 p-3 rounded max-h-32 overflow-y-auto">${attempt.transcript}</div>
                                    </div>

                                    <div>
                                        <div class="text-sm font-semibold mb-1">Nhận xét:</div>
                                        <div class="text-sm bg-blue-50 p-3 rounded">${attempt.feedback}</div>
                                    </div>
                                </div>
                            `).join('') 
                        : '<div class="text-center text-gray-500 py-8">Chưa có bài làm</div>'}
                    </div>
                </div>
            </div>
        `;
    }

    return `
        <div class="min-h-screen bg-gradient-to-br from-green-50 to-emerald-100 p-4">
            <div class="max-w-7xl mx-auto">
                <div class="bg-white rounded-lg shadow-md p-4 mb-6 flex justify-between items-center">
                    <div>
                        <h2 class="text-xl font-bold text-green-600">Dashboard Giáo Viên</h2>
                        <p class="text-sm text-gray-600">Quản lý và theo dõi kết quả học sinh</p>
                    </div>
                    <button onclick="logout()" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600">
                        Đăng Xuất
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow-xl p-6">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-2xl font-bold text-indigo-600">👥 Quản Lý Học Sinh</h2>
                        <div class="flex gap-2">
                            <button onclick="loadAllStudents(); render();" 
                                    class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                                🔄 Làm mới
                            </button>
                            <button onclick="exportCSV()" 
                                    class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600">
                                📥 Xuất Excel
                            </button>
                        </div>
                    </div>

                    ${state.allStudentsData.length === 0 ? `
                        <div class="text-center text-gray-500 py-12">
                            <div class="text-6xl mb-4">👥</div>
                            <p>Chưa có dữ liệu học sinh</p>
                        </div>
                    ` : `
                        <div class="overflow-x-auto">
                            <table class="w-full">
                                <thead>
                                    <tr class="bg-gray-50">
                                        <th class="text-left p-3">Mã HS</th>
                                        <th class="text-left p-3">Tên</th>
                                        <th class="text-center p-3">Level</th>
                                        <th class="text-center p-3">Số lần</th>
                                        <th class="text-center p-3">Tổng</th>
                                        <th class="text-center p-3">TB</th>
                                        <th class="text-center p-3">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${state.allStudentsData.map(student => `
                                        <tr class="border-t hover:bg-gray-50">
                                            <td class="p-3 font-mono">${student.code}</td>
                                            <td class="p-3">${student.name}</td>
                                            <td class="p-3 text-center">
                                                <span class="px-2 py-1 bg-indigo-100 text-indigo-600 rounded text-sm font-semibold">
                                                    ${student.targetLevel}
                                                </span>
                                            </td>
                                            <td class="p-3 text-center">${student.totalAttempts}</td>
                                            <td class="p-3 text-center font-bold text-green-600">${student.totalScore}</td>
                                            <td class="p-3 text-center font-bold text-purple-600">${student.averageScore}</td>
                                            <td class="p-3 text-center">
                                                <button onclick="viewStudentDetail('${student.code}')" 
                                                        class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">
                                                    👁️ Xem
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `}
                </div>
            </div>
        </div>
    `;
}

async function viewStudentDetail(code) {
    try {
        const response = await callAppsScript('getStudentDetail', { code });
        if (response.success) {
            state.selectedStudent = response.data;
            state.viewMode = 'detail';
            render();
        }
    } catch (error) {
        alert('Lỗi tải chi tiết học sinh!');
    }
}

async function showLeaderboardModal() {
    state.showLeaderboard = true;
    render();
    
    const leaders = await loadLeaderboard();
    
    const modal = document.getElementById('leaderboard-modal');
    const content = document.getElementById('leaderboard-content');
    
    if (leaders.length === 0) {
        content.innerHTML = '<div class="text-center text-gray-500 py-8">Chưa có dữ liệu xếp hạng</div>';
        return;
    }
    
    content.innerHTML = leaders.map((student, index) => {
        const bgColor = index === 0 ? 'bg-yellow-50 border-2 border-yellow-400' :
                       index === 1 ? 'bg-gray-50 border-2 border-gray-400' :
                       index === 2 ? 'bg-orange-50 border-2 border-orange-400' : 'bg-gray-50';
        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `#${index + 1}`;
        
        return `
            <div class="p-4 rounded-lg flex items-center justify-between mb-3 ${bgColor}">
                <div class="flex items-center gap-4">
                    <div class="text-2xl font-bold w-8">${medal}</div>
                    <div>
                        <div class="font-semibold">${student.name}</div>
                        <div class="text-sm text-gray-600">Level: ${student.targetLevel} | ${student.totalAttempts} lần thi</div>
                    </div>
                </div>
                <div class="text-right">
                    <div class="text-2xl font-bold text-blue-600">${student.totalScore}</div>
                    <div class="text-sm text-gray-600">TB: ${student.averageScore}</div>
                </div>
            </div>
        `;
    }).join('');
}

function closeLeaderboard() {
    state.showLeaderboard = false;
    render();
}

// ============= MAIN RENDER =============
function render() {
    const app = document.getElementById('app');
    
    let html = '';
    
    if (!state.isLoggedIn) {
        html = renderLoginScreen();
    } else if (state.userType === 'student') {
        html = renderStudentView();
    } else if (state.userType === 'teacher') {
        html = renderTeacherView();
    }
    
    // Add leaderboard modal
    if (state.showLeaderboard) {
        html += `
            <div id="leaderboard-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[80vh] overflow-auto">
                    <div class="p-6">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-bold flex items-center gap-2">
                                🏆 Bảng Xếp Hạng
                            </h2>
                            <button onclick="closeLeaderboard()" class="text-gray-500 hover:text-gray-700 text-2xl">
                                ✕
                            </button>
                        </div>
                        <div id="leaderboard-content">
                            <div class="text-center py-8">
                                <div class="animate-spin mx-auto mb-2 w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full"></div>
                                <p>Đang tải...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    app.innerHTML = html;
}

// ============= INITIALIZE =============
window.onload = () => {
    render();
};
</script>

</body>
</html>
