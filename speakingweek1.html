<script>
    // === CẤU HÌNH CHUNG ===
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUjFwmd4kTEm7Ya9d74Tk7bMIMoPRbnyPYwb0lSc-bRspVFKCohKOwvcGBuUtr5ZoX/exec";

    // ... IMAGE_PAIRS (giữ nguyên)

    // === BIẾN TOÀN CỤC ===
    let studentName = "";
    let currentPair = null;
    let recognition, mediaRecorder, audioChunks = [];
    let finalTranscript = "";
    let isRecognizing = false;
    let timerInterval, timeLeft = 60;

    // === BẮT ĐẦU TRÒ CHƠI ===
    function startGame() {
        studentName = document.getElementById("studentName").value.trim();
        if (!studentName) return alert("Vui lòng nhập tên em!");
        
        document.getElementById("codeScreen").classList.add("hidden");
        document.getElementById("gameScreen").classList.remove("hidden");
        document.getElementById("studentInfo").textContent = `${studentName} – FCE Speaking Week 1`;
        
        loadRandomPair();
        finalTranscript = "";
        document.getElementById("transcript").value = "";
        document.getElementById("reviewSection").classList.add("hidden");
        document.getElementById("resultSection").classList.add("hidden");
    }

    function loadRandomPair() {
        currentPair = IMAGE_PAIRS[Math.floor(Math.random() * IMAGE_PAIRS.length)];
        document.getElementById("img1").src = currentPair.img1 + `?t=${Date.now()}`;
        document.getElementById("img2").src = currentPair.img2 + `?t=${Date.now()}`;
        resetTimer();
    }

    // === TIMER ===
    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 60;
        document.getElementById("timer").textContent = "60";
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById("timer").textContent = "0";
                alert("Hết giờ! Nhưng bạn vẫn có thể nói tiếp.");
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    // === SPEECH RECOGNITION ===
    function startRecognition() {
        if (!('webkitSpeechRecognition' in window)) {
            alert("Dùng Chrome/Edge!");
            return;
        }

        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                document.getElementById("playback").src = URL.createObjectURL(blob);
            };
        });

        recognition.onresult = (e) => {
            let final = "", interim = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                const t = e.results[i][0].transcript;
                if (e.results[i].isFinal) final += t + " ";
                else interim += t;
            }
            finalTranscript = final;
            document.getElementById("transcript").value = final + interim;
        };

        recognition.onerror = () => stopRecognition();
        recognition.onend = () => {
            if (isRecognizing) recognition.start(); // TỰ KHỞI ĐỘNG LẠI
        };

        recognition.start();
        isRecognizing = true;
        document.getElementById("micBtn").textContent = "Dừng nói";
        document.getElementById("waveform").classList.remove("hidden");
        resetTimer(); // GỌI NGAY KHI BẤM
    }

    function stopRecognition() {
        if (recognition) recognition.stop();
        isRecognizing = false;
    }

    function stopRecordingAndShowReview() {
        if (mediaRecorder) mediaRecorder.stop();
        stopTimer();
        document.getElementById("micBtn").textContent = "Bắt đầu nói";
        document.getElementById("waveform").classList.add("hidden");

        if (finalTranscript.trim()) {
            document.getElementById("transcript").value = finalTranscript.trim();
            document.getElementById("reviewSection").classList.remove("hidden");
        }
    }

    // === NÚT MIC ===
    document.getElementById("micBtn").addEventListener("click", () => {
        if (isRecognizing) {
            stopRecognition();
            stopRecordingAndShowReview();
        } else {
            startRecognition();
        }
    });

    // === GỬI BÀI ===
    async function submitSpeech() {
        const transcript = document.getElementById("transcript").value.trim();
        if (!transcript) return alert("Chưa có lời nói!");

        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Đang chấm...';

        try {
            const res = await fetch(SCRIPT_URL + "?preflight=true", { method: "OPTIONS" });
            if (!res.ok) throw new Error("CORS error");

            const res2 = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: studentName, transcript })
            });
            const data = await res2.json();
            if (!data.success) throw new Error(data.error);
            showResult(data);
        } catch (err) {
            alert("Lỗi gửi: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Gửi AI chấm!";
        }
    }

    // === HIỂN THỊ KẾT QUẢ ===
    function showResult(data) {
        document.getElementById("resultSection").classList.remove("hidden");
        document.getElementById("scoreText").textContent = `${data.score}%`;
        document.getElementById("feedbackText").textContent = data.feedback || "Cố lên!";
        const cup = data.score >= 90 ? "Vàng" : data.score >= 75 ? "Bạc" : "Đồng";
        document.getElementById("cupDisplay").textContent = cup;
    }

    // === CHƠI TIẾP ===
    function nextRound() {
        document.getElementById("resultSection").classList.add("hidden");
        loadRandomPair();
    }

    // === BẢNG XẾP HẠNG ===
    async function showLeaderboard() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=leaderboard&preflight=true", { method: "OPTIONS" });
            const res2 = await fetch(SCRIPT_URL + "?action=leaderboard");
            const data = await res2.json();
            const lb = data.leaderboard || [];
            const body = document.getElementById("leaderboardBody");
            body.innerHTML = lb.length ? lb.map((p, i) => `
                <div class="flex justify-between p-2 bg-gray-50 rounded">
                    <span class="font-bold">#${i+1} ${p.name}</span>
                    <span class="text-green-600 font-bold">${p.avg} điểm</span>
                </div>
            `).join("") : "<p class='text-center text-gray-500'>Chưa có dữ liệu</p>";
            document.getElementById("leaderboardModal").classList.remove("hidden");
        } catch (err) {
            alert("Lỗi tải bảng xếp hạng");
        }
    }

    function closeLeaderboard() {
        document.getElementById("leaderboardModal").classList.add("hidden");
    }

    function clearTranscript() {
        finalTranscript = "";
        document.getElementById("transcript").value = "";
        document.getElementById("playback").src = "";
        document.getElementById("reviewSection").classList.add("hidden");
    }
</script>
