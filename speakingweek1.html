<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCE Speaking Week 1 - LIME</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 50%, #81C784 100%);
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4CAF50;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .waveform { 
            height: 60px; 
            background: linear-gradient(to right, #10b981, #3b82f6); 
            border-radius: 8px; 
            animation: pulse 1s infinite; 
        }
        @keyframes pulse { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0.7; } 
        }
    </style>
</head>
<body>

<!-- MÀN HÌNH NHẬP TÊN -->
<div id="codeScreen" class="min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <div class="bg-white rounded-2xl shadow-2xl p-8 mt-8">
            <div class="text-center mb-8">
                <img src="https://gofirst.pro/images/uploads/62/baseimg/logo_16541442053.png" 
                     alt="LIME Logo" class="w-32 h-32 mx-auto mb-4 object-contain">
                <h1 class="text-4xl font-bold text-green-700 mb-2">Trung Tâm Tiếng Anh LIME</h1>
                <p class="text-green-600 text-lg">FCE SPEAKING - WEEK 1</p>
            </div>
            
            <div class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 mb-6">
                <div class="flex items-start gap-2">
                    <svg class="w-6 h-6 text-yellow-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                    </svg>
                    <div class="text-yellow-800 text-sm">
                        <p class="font-bold mb-1">Lưu ý:</p>
                        <p>• Phải nhập đúng tên trong danh sách</p>
                        <p>• Giữ nút để nói, thả để dừng</p>
                        <p>• AI chấm theo tiêu chí FCE</p>
                    </div>
                </div>
            </div>

            <div>
                <label class="block text-green-800 font-semibold mb-2">Tên học sinh *</label>
                <input type="text" id="studentName" 
                    class="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:border-green-500 focus:outline-none"
                    placeholder="VD: An, Bình, Minh...">
                <p id="nameError" class="text-red-600 text-sm mt-1 hidden"></p>
            </div>

            <button onclick="startGame()" id="startBtn"
                class="w-full mt-6 bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-6 rounded-lg transition duration-300 text-lg shadow-lg">
                BẮT ĐẦU CHƠI!
            </button>
        </div>
    </div>
</div>

<!-- MÀN HÌNH CHƠI -->
<div id="gameScreen" class="hidden container mx-auto p-4 max-w-5xl">
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
        <div class="flex justify-between items-center mb-4">
            <h2 id="studentInfo" class="text-2xl font-bold text-green-700"></h2>
            <button onclick="showLeaderboard()" class="bg-yellow-500 text-white px-4 py-2 rounded-lg font-bold">
                Bảng Xếp Hạng
            </button>
        </div>

        <div class="bg-blue-50 border-l-4 border-blue-600 p-4 mb-6 rounded-r-xl">
            <p class="text-blue-800 font-bold mb-2">Câu hỏi:</p>
            <p class="text-blue-700 text-lg">
                <strong>So sánh 2 ảnh và nói:</strong><br>
                <em>"Tại sao những người trong ảnh lại làm những việc đó?"</em>
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div class="relative">
                <img id="img1" class="w-full rounded-xl shadow-md" src="" alt="Ảnh 1" />
                <div class="absolute top-2 left-2 bg-red-500 text-white px-3 py-1 rounded-full font-bold">Ảnh 1</div>
            </div>
            <div class="relative">
                <img id="img2" class="w-full rounded-xl shadow-md" src="" alt="Ảnh 2" />
                <div class="absolute top-2 left-2 bg-blue-500 text-white px-3 py-1 rounded-full font-bold">Ảnh 2</div>
            </div>
        </div>

        <div class="text-center mb-6">
            <div id="timer" class="text-5xl font-bold text-red-600 mb-4">60</div>
            <button id="micBtn" class="bg-red-600 text-white px-8 py-4 rounded-full text-xl font-bold shadow-lg hover:bg-red-700 transition">
                Bắt đầu nói
            </button>
            <div id="waveform" class="waveform mt-4 hidden"></div>
        </div>

        <div id="reviewSection" class="hidden bg-gray-50 p-6 rounded-xl">
            <h3 class="text-xl font-bold mb-3">Nghe lại & Gửi</h3>
            <audio id="playback" controls class="w-full mb-4"></audio>
            <textarea id="transcript" class="w-full p-3 border rounded-lg h-32 mb-4" readonly placeholder="Transcript..."></textarea>
            <div class="flex gap-3">
                <button onclick="clearTranscript()" class="flex-1 bg-orange-500 text-white py-3 rounded-lg font-bold hover:bg-orange-600">
                    Nói lại
                </button>
                <button onclick="submitSpeech()" id="submitBtn" class="flex-1 bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700">
                    Gửi AI chấm!
                </button>
            </div>
        </div>
    </div>

    <div id="resultSection" class="hidden bg-gradient-to-r from-green-400 to-blue-500 text-white p-6 rounded-2xl shadow-lg text-center">
        <h3 class="text-3xl font-bold mb-4">Kết quả!</h3>
        <p id="scoreText" class="text-5xl font-bold mb-2"></p>
        <p id="feedbackText" class="text-xl mb-4"></p>
        <div id="detailsText" class="text-sm mb-4"></div>
        <button onclick="nextRound()" class="bg-white text-green-600 px-6 py-3 rounded-lg font-bold hover:bg-gray-100">
            Chơi tiếp!
        </button>
    </div>
</div>

<!-- LEADERBOARD MODAL -->
<div id="leaderboardModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
        <h3 class="text-2xl font-bold text-center text-green-700 mb-4">Bảng Xếp Hạng</h3>
        <div id="leaderboardBody" class="space-y-2 max-h-96 overflow-y-auto"></div>
        <button onclick="closeLeaderboard()" class="mt-4 w-full bg-gray-600 text-white py-2 rounded-lg font-bold">
            Đóng
        </button>
    </div>
</div>

<script>
    // === CẤU HÌNH ===
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxUjFwmd4kTEm7Ya9d74Tk7bMIMoPRbnyPYwb0lSc-bRspVFKCohKOwvcGBuUtr5ZoX/exec";

    const IMAGE_PAIRS = [
        { img1: "https://loremflickr.com/400/300/study,group", img2: "https://loremflickr.com/400/300/discuss,team", id: 1 },
        { img1: "https://loremflickr.com/400/300/online,learning", img2: "https://loremflickr.com/400/300/yoga,people", id: 2 },
        { img1: "https://loremflickr.com/400/300/kids,play", img2: "https://loremflickr.com/400/300/cooking,family", id: 3 },
        { img1: "https://loremflickr.com/400/300/classroom,student", img2: "https://loremflickr.com/400/300/music,band", id: 4 },
        { img1: "https://loremflickr.com/400/300/art,painting", img2: "https://loremflickr.com/400/300/soccer,team", id: 5 }
    ];

    let studentName = "";
    let studentID = "";
    let currentPair = null;
    let recognition, mediaRecorder, audioChunks = [];
    let finalTranscript = "";
    let isRecognizing = false;
    let timerInterval, timeLeft = 60;

    // === KIỂM TRA VÀ BẮT ĐẦU ===
    async function startGame() {
        const nameInput = document.getElementById("studentName").value.trim();
        const errorEl = document.getElementById("nameError");
        const btn = document.getElementById("startBtn");
        
        if (!nameInput) {
            errorEl.textContent = "Vui lòng nhập tên!";
            errorEl.classList.remove("hidden");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Đang kiểm tra...';

        try {
            const res = await fetch(SCRIPT_URL + `?action=checkStudent&name=${encodeURIComponent(nameInput)}`);
            const data = await res.json();

            if (!data.success) {
                throw new Error(data.error || "Lỗi kết nối");
            }

            if (!data.found) {
                errorEl.textContent = "Tên không có trong danh sách học sinh!";
                errorEl.classList.remove("hidden");
                btn.disabled = false;
                btn.innerHTML = "BẮT ĐẦU CHƠI!";
                return;
            }

            // OK - vào game
            studentName = nameInput;
            studentID = data.id;
            
            document.getElementById("codeScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            document.getElementById("studentInfo").textContent = `${studentName} (${data.target || "FCE"})`;
            
            loadRandomPair();
            setupMicButton();

        } catch (err) {
            errorEl.textContent = "Lỗi kết nối: " + err.message;
            errorEl.classList.remove("hidden");
            btn.disabled = false;
            btn.innerHTML = "BẮT ĐẦU CHƠI!";
        }
    }

    // === TẢI ẢNH ===
    function loadRandomPair() {
        currentPair = IMAGE_PAIRS[Math.floor(Math.random() * IMAGE_PAIRS.length)];
        document.getElementById("img1").src = currentPair.img1 + `?t=${Date.now()}`;
        document.getElementById("img2").src = currentPair.img2 + `?t=${Date.now()}`;
        resetTimer();
        finalTranscript = "";
        document.getElementById("transcript").value = "";
        document.getElementById("reviewSection").classList.add("hidden");
        document.getElementById("resultSection").classList.add("hidden");
    }

    // === TIMER ===
    function resetTimer() {
        clearInterval(timerInterval);
        timeLeft = 60;
        document.getElementById("timer").textContent = "60";
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById("timer").textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById("timer").textContent = "0";
            }
        }, 1000);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    // === MIC SETUP ===
    function setupMicButton() {
        const micBtn = document.getElementById("micBtn");
        
        micBtn.addEventListener("mousedown", startRecognition);
        micBtn.addEventListener("mouseup", stopAndReview);
        
        micBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            startRecognition();
        });
        
        micBtn.addEventListener("touchend", (e) => {
            e.preventDefault();
            stopAndReview();
        });
    }

    // === SPEECH RECOGNITION ===
    function startRecognition() {
        if (isRecognizing) return;
        
        if (!('webkitSpeechRecognition' in window)) {
            alert("Vui lòng dùng Chrome/Edge!");
            return;
        }

        recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.start();
            audioChunks = [];

            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            
            mediaRecorder.onstop = () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                // FIX: createObjectURL thay vì createObjectObject
                document.getElementById("playback").src = URL.createObjectURL(blob);
            };
        }).catch(err => {
            console.error("Mic error:", err);
            alert("Không thể truy cập micro!");
        });

        recognition.onresult = (e) => {
            let final = "";
            for (let i = e.resultIndex; i < e.results.length; i++) {
                const t = e.results[i][0].transcript;
                if (e.results[i].isFinal) {
                    final += t + " ";
                }
            }
            if (final) {
                finalTranscript += final;
                document.getElementById("transcript").value = finalTranscript;
            }
        };

        recognition.onerror = (e) => {
            console.error("Recognition error:", e);
            stopRecognition();
        };

        recognition.onend = () => {
            if (isRecognizing) {
                recognition.start();
            }
        };

        recognition.start();
        isRecognizing = true;
        
        document.getElementById("micBtn").textContent = "Đang nói... (Thả để dừng)";
        document.getElementById("micBtn").classList.add("bg-blue-600");
        document.getElementById("waveform").classList.remove("hidden");
        
        startTimer();
    }

    function stopRecognition() {
        if (recognition) {
            recognition.stop();
        }
        isRecognizing = false;
    }

    function stopAndReview() {
        stopRecognition();
        
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }
        
        stopTimer();
        
        document.getElementById("micBtn").textContent = "Bắt đầu nói";
        document.getElementById("micBtn").classList.remove("bg-blue-600");
        document.getElementById("waveform").classList.add("hidden");

        if (finalTranscript.trim()) {
            document.getElementById("reviewSection").classList.remove("hidden");
        }
    }

    // === GỬI BÀI ===
    async function submitSpeech() {
        const transcript = document.getElementById("transcript").value.trim();
        
        if (!transcript) {
            alert("Chưa có lời nói!");
            return;
        }

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Đang chấm...';

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    action: "submit",
                    name: studentName, 
                    transcript 
                })
            });

            const data = await res.json();
            
            if (!data.success) {
                throw new Error(data.error || "Lỗi server");
            }

            showResult(data);

        } catch (err) {
            alert("Lỗi gửi bài: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = "Gửi AI chấm!";
        }
    }

    // === HIỂN THỊ KẾT QUẢ ===
    function showResult(data) {
        document.getElementById("resultSection").classList.remove("hidden");
        document.getElementById("scoreText").textContent = `${data.score}%`;
        document.getElementById("feedbackText").textContent = data.feedback || "Cố lên!";
        
        if (data.details) {
            document.getElementById("detailsText").innerHTML = `
                <div class="bg-white/20 p-3 rounded">
                    Grammar: ${data.details.grammar}/5 | 
                    Vocab: ${data.details.vocab}/5 | 
                    Discourse: ${data.details.discourse}/5 | 
                    Interactive: ${data.details.interactive}/5
                </div>
            `;
        }
    }

    // === CHƠI TIẾP ===
    function nextRound() {
        document.getElementById("resultSection").classList.add("hidden");
        loadRandomPair();
    }

    // === CLEAR ===
    function clearTranscript() {
        finalTranscript = "";
        document.getElementById("transcript").value = "";
        document.getElementById("playback").src = "";
        document.getElementById("reviewSection").classList.add("hidden");
    }

    // === LEADERBOARD ===
    async function showLeaderboard() {
        try {
            const res = await fetch(SCRIPT_URL + "?action=leaderboard");
            const data = await res.json();
            
            const lb = data.leaderboard || [];
            const body = document.getElementById("leaderboardBody");
            
            if (lb.length === 0) {
                body.innerHTML = "<p class='text-center text-gray-500'>Chưa có dữ liệu</p>";
            } else {
                body.innerHTML = lb.map((p, i) => `
                    <div class="flex justify-between p-3 bg-gray-50 rounded hover:bg-gray-100">
                        <span class="font-bold">#${p.rank} ${p.name}</span>
                        <span class="text-green-600 font-bold">${p.avg}</span>
                    </div>
                `).join("");
            }
            
            document.getElementById("leaderboardModal").classList.remove("hidden");
        } catch (err) {
            alert("Lỗi tải bảng xếp hạng: " + err.message);
        }
    }

    function closeLeaderboard() {
        document.getElementById("leaderboardModal").classList.add("hidden");
    }
</script>

</body>
</html>
