<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FCE Speaking Week 1 - LIME</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 50%, #81C784 100%); }
    .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #4CAF50; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .waveform { height: 50px; background: linear-gradient(to right, #10b981, #3b82f6); border-radius: 8px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  </style>
</head>
<body>

<!-- NHẬP TÊN -->
<div id="codeScreen" class="min-h-screen p-4 flex items-center justify-center">
  <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8">
    <div class="text-center mb-6">
      <img src="https://gofirst.pro/images/uploads/62/baseimg/logo_16541442053.png" alt="LIME" class="w-24 h-24 mx-auto mb-3">
      <h1 class="text-3xl font-bold text-green-700">LIME English</h1>
      <p class="text-green-600">FCE Speaking Challenge - Week 1</p>
    </div>
    <div class="bg-yellow-50 border-2 border-yellow-300 rounded-xl p-4 mb-6 text-sm">
      <p class="font-bold text-yellow-800">Lưu ý:</p>
      <ul class="list-disc list-inside text-yellow-700">
        <li>Nhập đúng tên trong danh sách</li>
        <li>Nhấn giữ để nói, thả để dừng</li>
        <li>AI chấm theo FCE + mục tiêu cá nhân</li>
      </ul>
    </div>
    <input type="text" id="studentName" class="w-full px-4 py-3 border-2 border-green-300 rounded-lg focus:border-green-500 outline-none" placeholder="Nhập tên...">
    <p id="nameError" class="text-red-600 text-sm mt-1 hidden"></p>
    <button onclick="startGame()" id="startBtn" class="w-full mt-4 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
      BẮT ĐẦU!
    </button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="hidden container mx-auto p-4 max-w-5xl">
  <div class="bg-white rounded-2xl shadow-lg p-6 mb-4">
    <div class="flex justify-between items-center mb-4">
      <h2 id="studentInfo" class="text-2xl font-bold text-green-700"></h2>
      <button onclick="showLeaderboard()" class="bg-yellow-500 hover:bg-yellow-600 text-white px-4 py-2 rounded-lg font-bold text-sm">
        Bảng Xếp Hạng
      </button>
    </div>

    <div class="bg-blue-50 border-l-4 border-blue-600 p-4 mb-6 rounded-r-xl">
      <p class="text-blue-800 font-bold">Câu hỏi:</p>
      <p class="text-blue-700"><em>So sánh 2 ảnh: "Tại sao người trong ảnh làm việc đó?"</em></p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
      <div class="relative"><img id="img1" class="w-full rounded-xl shadow-md" src="" alt="Ảnh 1"/><div class="absolute top-2 left-2 bg-red-500 text-white px-3 py-1 rounded-full text-sm font-bold">Ảnh 1</div></div>
      <div class="relative"><img id="img2" class="w-full rounded-xl shadow-md" src="" alt="Ảnh 2"/><div class="absolute top-2 left-2 bg-blue-500 text-white px-3 py-1 rounded-full text-sm font-bold">Ảnh 2</div></div>
    </div>

    <div class="text-center">
      <div id="timer" class="text-5xl font-bold text-red-600 mb-4">60</div>
      <button id="micBtn" class="bg-red-600 hover:bg-red-700 text-white px-8 py-4 rounded-full text-xl font-bold shadow-lg transition">
        Nhấn giữ để nói
      </button>
      <div id="waveform" class="waveform mt-4 hidden"></div>
      <p id="micStatus" class="text-sm text-gray-600 mt-2"></p>
    </div>

    <div id="reviewSection" class="hidden bg-gray-50 p-6 rounded-xl mt-6">
      <h3 class="text-xl font-bold mb-3">Nghe lại & Gửi</h3>
      <audio id="playback" controls class="w-full mb-4"></audio>
      <textarea id="transcript" class="w-full p-3 border rounded-lg h-32 mb-4" readonly></textarea>
      <div class="flex gap-3">
        <button onclick="clearTranscript()" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-lg font-bold">Nói lại</button>
        <button onclick="submitSpeech()" id="submitBtn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-3 rounded-lg font-bold">Gửi AI chấm!</button>
      </div>
    </div>
  </div>

  <div id="resultSection" class="hidden bg-gradient-to-r from-green-400 to-blue-500 text-white p-6 rounded-2xl shadow-lg text-center">
    <h3 class="text-3xl font-bold mb-4">Kết quả!</h3>
    <p id="scoreText" class="text-5xl font-bold mb-2"></p>
    <p id="feedbackText" class="text-xl mb-4"></p>
    <div id="detailsText" class="text-sm mb-4"></div>
    <button onclick="nextRound()" class="bg-white text-green-600 px-6 py-3 rounded-lg font-bold hover:bg-gray-100">Chơi tiếp!</button>
  </div>
</div>

<!-- LEADERBOARD MODAL -->
<div id="leaderboardModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50">
  <div class="bg-white rounded-2xl p-6 w-full max-w-md mx-4">
    <h3 class="text-2xl font-bold text-center text-green-700 mb-4">Bảng Xếp Hạng</h3>
    <div id="leaderboardBody" class="space-y-2 max-h-96 overflow-y-auto"></div>
    <button onclick="closeLeaderboard()" class="mt-4 w-full bg-gray-600 hover:bg-gray-700 text-white py-2 rounded-lg font-bold">Đóng</button>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyh16aq39CX_2XCaCRNIF8pn2W7eq3iunwdTqF9sS9qHSJcI6vEGbv6zoW8qblHjRpX/exec"; // THAY BẰNG URL CỦA BẠN
  const IMAGE_PAIRS = [
    { img1: "https://loremflickr.com/400/300/study,group", img2: "https://loremflickr.com/400/300/discuss,team" },
    { img1: "https://loremflickr.com/400/300/online,learning", img2: "https://loremflickr.com/400/300/yoga,people" },
    { img1: "https://loremflickr.com/400/300/kids,play", img2: "https://loremflickr.com/400/300/cooking,family" },
  ];

  let studentName = "", studentID = "", currentPair = null, recognition = null, mediaRecorder = null;
  let audioChunks = [], finalTranscript = "", isRecognizing = false, timerInterval = null, timeLeft = 60, micStream = null;

  async function startGame() {
    const name = document.getElementById("studentName").value.trim();
    const errorEl = document.getElementById("nameError");
    if (!name) return errorEl.classList.remove("hidden"), errorEl.textContent = "Nhập tên!";

    const btn = document.getElementById("startBtn");
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Đang kiểm tra...';

    try {
      const res = await fetch(`${SCRIPT_URL}?action=checkStudent&name=${encodeURIComponent(name)}`);
      const data = await res.json();
      if (!data.found) throw new Error("Tên không có trong danh sách!");

      studentName = name; studentID = data.id;
      document.getElementById("codeScreen").classList.add("hidden");
      document.getElementById("gameScreen").classList.remove("hidden");
      document.getElementById("studentInfo").textContent = `${name} (${data.target || "FCE"})`;
      loadRandomPair(); setupMicButton();
    } catch (err) {
      errorEl.classList.remove("hidden"); errorEl.textContent = err.message;
    } finally {
      btn.disabled = false; btn.innerHTML = "BẮT ĐẦU!";
    }
  }

  function loadRandomPair() {
    currentPair = IMAGE_PAIRS[Math.floor(Math.random() * IMAGE_PAIRS.length)];
    document.getElementById("img1").src = currentPair.img1 + `?t=${Date.now()}`;
    document.getElementById("img2").src = currentPair.img2 + `?t=${Date.now()}`;
    resetTimer(); finalTranscript = ""; document.getElementById("transcript").value = "";
    document.getElementById("reviewSection").classList.add("hidden");
    document.getElementById("resultSection").classList.add("hidden");
  }

  function resetTimer() { clearInterval(timerInterval); timeLeft = 60; document.getElementById("timer").textContent = "60"; }
  function startTimer() {
    timerInterval = setInterval(() => {
      if (--timeLeft <= 0) { clearInterval(timerInterval); document.getElementById("timer").textContent = "0"; }
      else document.getElementById("timer").textContent = timeLeft;
    }, 1000);
  }

  function setupMicButton() {
    const btn = document.getElementById("micBtn");
    btn.addEventListener("mousedown", handleMicStart);
    btn.addEventListener("mouseup", handleMicStop);
    btn.addEventListener("touchstart", (e) => { e.preventDefault(); handleMicStart(); });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); handleMicStop(); });
  }

  async function handleMicStart() {
    if (isRecognizing) return;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(micStream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => e.data.size > 0 && audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        document.getElementById("playback").src = URL.createObjectURL(blob);
      };
      mediaRecorder.start();

      recognition = new (window.SpeechRecognition || webkitSpeechRecognition)();
      recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'en-US';
      recognition.onresult = e => {
        let interim = "", final = finalTranscript;
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const t = e.results[i][0].transcript;
          e.results[i].isFinal ? final += t + " " : interim += t;
        }
        finalTranscript = final;
        document.getElementById("transcript").value = final + interim;
      };
      recognition.start(); isRecognizing = true;

      document.getElementById("micBtn").textContent = "Đang nói..."; 
      document.getElementById("micBtn").classList.replace("bg-red-600", "bg-blue-600");
      document.getElementById("waveform").classList.remove("hidden");
      startTimer();
    } catch (err) { alert("Micro không hoạt động!"); }
  }

  function handleMicStop() {
    if (!isRecognizing) return;
    isRecognizing = false;
    recognition?.stop(); mediaRecorder?.stop(); micStream?.getTracks().forEach(t => t.stop());
    clearInterval(timerInterval);
    document.getElementById("micBtn").textContent = "Nhấn giữ để nói";
    document.getElementById("micBtn").classList.replace("bg-blue-600", "bg-red-600");
    document.getElementById("waveform").classList.add("hidden");
    if (finalTranscript.trim()) document.getElementById("reviewSection").classList.remove("hidden");
  }

  async function submitSpeech() {
    const transcript = document.getElementById("transcript").value.trim();
    if (!transcript) return alert("Chưa có lời nói!");

    const btn = document.getElementById("submitBtn"); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Đang chấm...';

    let audioBase64 = null;
    if (audioChunks.length > 0) {
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      audioBase64 = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(blob);
      });
    }

    try {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: "submit", name: studentName, transcript, audioBase64 })
      });
      const data = await res.json();
      if (!data.success) throw new Error(data.error);
      showResult(data);
    } catch (err) { alert("Lỗi: " + err.message); }
    finally { btn.disabled = false; btn.innerHTML = "Gửi AI chấm!"; }
  }

  function showResult(d) {
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("scoreText").textContent = `${d.score}%`;
    document.getElementById("feedbackText").textContent = d.feedback;
    document.getElementById("detailsText").innerHTML = `
      <div class="bg-white/20 p-3 rounded text-sm">
        Grammar: ${d.details.grammar}/5 | Vocab: ${d.details.vocab}/5 | 
        Discourse: ${d.details.discourse}/5 | Interactive: ${d.details.interactive}/5
      </div>`;
  }

  function nextRound() { document.getElementById("resultSection").classList.add("hidden"); loadRandomPair(); }
  function clearTranscript() { finalTranscript = ""; document.getElementById("transcript").value = ""; document.getElementById("playback").src = ""; document.getElementById("reviewSection").classList.add("hidden"); }

  async function showLeaderboard() {
    const res = await fetch(`${SCRIPT_URL}?action=leaderboard`);
    const data = await res.json();
    const body = document.getElementById("leaderboardBody");
    body.innerHTML = data.leaderboard.length === 0 
      ? "<p class='text-center text-gray-500'>Chưa có dữ liệu</p>"
      : data.leaderboard.map(p => `
        <div class="flex justify-between p-3 bg-gray-50 rounded hover:bg-gray-100">
          <span class="font-bold">#${p.rank} ${p.name}</span>
          <span class="text-green-600 font-bold">${p.avg}</span>
        </div>`).join("");
    document.getElementById("leaderboardModal").classList.remove("hidden");
  }
  function closeLeaderboard() { document.getElementById("leaderboardModal").classList.add("hidden"); }
</script>
</body>
</html>
